[package]
name = "neko-tech-localstorage"
version = "0.1.0"
edition = "2024"

[lib]
name = "neko_tech_localstorage"

[dependencies]
neko-tech-persistence = { path = "../neko-tech-persistence/" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

